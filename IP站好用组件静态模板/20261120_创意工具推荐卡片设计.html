<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>器物志 · Curated Tools</title>

  <style>
    /* =====================================================================
       DESIGN TOKENS — APPLE / DIETER RAMS MINIMALISM & SWISS EDITORIAL
       ===================================================================== */
    :root {
      --canvas: #F5F5F2;
      --surface: #FFFFFF;
      --surface-soft: #FAF9F7;
      --ink: #181816;
      --ink-secondary: #666660;
      --ink-muted: #93938B;
      --hairline: #E5E5DF;
      --hairline-strong: rgba(24, 24, 22, 0.12);
      --tea: #2E5242;
      --tea-hover: #234033;
      --tea-mist: #EAF0ED;
      --obsidian: #1C1D1B;
      --titanium: #E6E8E4;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
        Monaco, Consolas, monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background-color: var(--canvas);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--canvas);
      background-image:
        radial-gradient(
          ellipse 110% 55% at 50% -12%,
          rgba(255, 255, 255, 0.78) 0%,
          rgba(245, 245, 242, 0) 68%
        ),
        radial-gradient(rgba(24, 24, 22, 0.028) 0.5px, transparent 0.5px);
      background-size: 100% 100%, 16px 16px;
      color: var(--ink);
      font-family: var(--font-sans);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    ::selection {
      background-color: var(--tea-mist);
      color: var(--tea);
    }

    button,
    input {
      font-family: inherit;
    }

    /* =====================================================================
       PAGE CONTAINER & HEADER TOOLBAR
       ===================================================================== */
    .page-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 48px 36px 96px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px 24px;
      padding-bottom: 24px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--hairline);
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-title {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: var(--ink);
    }

    .brand-divider {
      color: rgba(147, 147, 139, 0.5);
      font-weight: 300;
      user-select: none;
    }

    .brand-subtitle {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--ink-secondary);
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* =====================================================================
       SEGMENTED FILTER WITH SLIDING WHITE PILL INDICATOR
       ===================================================================== */
    .seg-track {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 3px;
      background-color: rgba(24, 24, 22, 0.048);
      border-radius: 10px;
      box-shadow: inset 0 0 0 1px rgba(24, 24, 22, 0.045);
      max-width: 100%;
      overflow-x: auto;
    }

    .seg-pill {
      position: absolute;
      top: 3px;
      left: 0;
      height: calc(100% - 6px);
      width: 0;
      background-color: var(--surface);
      border-radius: 7.5px;
      box-shadow:
        0 1px 2px rgba(24, 24, 22, 0.06),
        0 2px 6px rgba(24, 24, 22, 0.04),
        0 0 0 0.5px rgba(24, 24, 22, 0.05);
      transform: translate3d(0, 0, 0);
      transition:
        transform 0.36s var(--spring),
        width 0.36s var(--spring);
      pointer-events: none;
      z-index: 0;
    }

    .seg-btn {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      padding: 6px 13px;
      border-radius: 7.5px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-secondary);
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .seg-btn:hover,
    .seg-btn.is-active {
      color: var(--ink);
    }

    .seg-count {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-muted);
    }

    /* =====================================================================
       MINIMALIST REAL-TIME SEARCH INPUT
       ===================================================================== */
    .search-wrap {
      position: relative;
      width: 224px;
    }

    .search-input {
      width: 100%;
      height: 34px;
      padding: 0 30px 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(24, 24, 22, 0.085);
      background-color: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      font-size: 12.5px;
      outline: none;
      box-shadow: 0 1px 2px rgba(24, 24, 22, 0.02);
      transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--ink-muted);
    }

    .search-input:hover {
      background-color: var(--surface);
    }

    .search-input:focus {
      background-color: var(--surface);
      border-color: rgba(46, 82, 66, 0.45);
      box-shadow: 0 0 0 3px rgba(46, 82, 66, 0.07);
    }

    .search-clear {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 50%;
      background-color: rgba(24, 24, 22, 0.08);
      color: var(--ink-secondary);
      font-size: 12px;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    .search-clear.is-visible {
      display: inline-flex;
    }

    .search-clear:hover {
      background-color: rgba(24, 24, 22, 0.16);
      color: var(--ink);
    }

    /* =====================================================================
       PRECISION HARDWARE TOGGLE SWITCH ("展开内芯")
       ===================================================================== */
    .hw-toggle {
      height: 34px;
      padding: 0 10px 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(24, 24, 22, 0.085);
      background-color: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(24, 24, 22, 0.02);
      transition: background-color 0.2s ease, border-color 0.2s ease;
      flex-shrink: 0;
    }

    .hw-toggle:hover {
      background-color: var(--surface);
      border-color: rgba(24, 24, 22, 0.15);
    }

    .hw-track {
      position: relative;
      width: 32px;
      height: 18px;
      border-radius: 999px;
      background-color: #DBDCD6;
      box-shadow:
        inset 0 1px 2px rgba(24, 24, 22, 0.14),
        inset 0 0 0 1px rgba(24, 24, 22, 0.06);
      transition: background-color 0.28s var(--spring);
      flex-shrink: 0;
    }

    .hw-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(180deg, #FFFFFF 0%, #F2F3EF 100%);
      box-shadow:
        0 1px 2.5px rgba(24, 24, 22, 0.24),
        0 0 0 0.5px rgba(24, 24, 22, 0.06);
      transform: translate3d(0, 0, 0);
      transition: transform 0.32s var(--spring);
    }

    .hw-toggle.is-active .hw-track {
      background-color: var(--tea);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .hw-toggle.is-active .hw-thumb {
      transform: translate3d(14px, 0, 0);
    }

    /* =====================================================================
       STRICT 5-COLUMN GALLERY GRID & RESPONSIVE BREAKPOINTS
       ===================================================================== */
    .folio-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 24px 20px;
    }

    @media (max-width: 1199px) {
      .folio-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 959px) {
      .page-shell {
        padding: 36px 24px 80px;
      }
      .folio-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 679px) {
      .page-shell {
        padding: 28px 18px 72px;
      }
      .folio-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 14px;
      }
      .search-wrap {
        width: 100%;
        flex: 1 1 180px;
      }
    }

    @media (max-width: 459px) {
      .folio-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
    }

    /* =====================================================================
       TWO-LAYER SLIDE-OUT POCKET SLEEVE CARD
       ===================================================================== */
    .folio-wrapper {
      position: relative;
      /* Reserves clean vertical space for the 39px upward inner-core slide */
      padding-top: 44px;
      cursor: pointer;
      outline: none;
    }

    .folio-stack {
      position: relative;
    }

    /* ----- BACK LAYER: SLIDE-OUT INNER CORE ----- */
    .inner-card {
      position: absolute;
      top: -7px;
      left: 6px;
      right: 6px;
      height: 92px;
      border-radius: 12px 12px 6px 6px;
      z-index: 1;
      overflow: hidden;
      transform: translate3d(0, 0, 0);
      transition:
        transform 0.48s var(--spring),
        box-shadow 0.44s var(--spring);
      will-change: transform;
    }

    /* Material 1: Open Source — Matte Obsidian */
    .inner-card--oss {
      background-color: var(--obsidian);
      color: #EAECEB;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 2px 8px rgba(24, 24, 22, 0.14);
    }

    /* Material 2: Software — Brushed Mist Titanium Silver */
    .inner-card--app {
      background: linear-gradient(135deg, #EAECE8 0%, #E2E5E0 100%);
      color: var(--ink);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.85),
        inset 0 0 0 1px rgba(24, 24, 22, 0.075),
        0 2px 8px rgba(24, 24, 22, 0.05);
    }

    /* Material 3: AI Skill — Deep Celadon Tea-Green */
    .inner-card--skill {
      background-color: var(--tea);
      color: #F4F6F3;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 2px 10px rgba(46, 82, 66, 0.18);
    }

    /* Minimalist 18px x 2.5px pill grip centered inside the 12.5px semicircular notch */
    .grip-capsule {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 2.5px;
      border-radius: 999px;
      pointer-events: none;
      transition:
        opacity 0.2s ease,
        transform 0.34s var(--spring);
    }

    .inner-card--oss .grip-capsule {
      background-color: rgba(234, 236, 235, 0.32);
      box-shadow: inset 0 0.5px 1px rgba(0, 0, 0, 0.55);
    }

    .inner-card--app .grip-capsule {
      background-color: rgba(24, 24, 22, 0.22);
      box-shadow: 0 0.5px 0 rgba(255, 255, 255, 0.75);
    }

    .inner-card--skill .grip-capsule {
      background-color: rgba(244, 246, 243, 0.38);
      box-shadow: inset 0 0.5px 1px rgba(0, 0, 0, 0.22);
    }

    /* Compact 40px Action Bar: Left = Payload Preview | Right = Direct Action */
    .inner-action-bar {
      height: 40px;
      padding: 0 9px 0 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition:
        opacity 0.24s ease,
        transform 0.42s var(--spring);
    }

    .inner-payload {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10.5px;
      line-height: 1.3;
    }

    .inner-payload--mono {
      font-family: var(--font-mono);
    }

    .inner-card--oss .inner-payload {
      color: #E3E6E3;
    }

    .inner-card--app .inner-payload {
      color: #353733;
    }

    .inner-card--skill .inner-payload {
      color: #ECF1ED;
    }

    .inner-action-btn {
      flex-shrink: 0;
      border: 0;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1.35;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      transition: background-color 0.18s ease, color 0.18s ease, transform 0.15s ease;
    }

    .inner-action-btn:active {
      transform: scale(0.96);
    }

    .inner-card--oss .inner-action-btn {
      background-color: rgba(255, 255, 255, 0.13);
      color: #F4F6F3;
    }

    .inner-card--oss .inner-action-btn:hover {
      background-color: rgba(255, 255, 255, 0.24);
    }

    .inner-card--app .inner-action-btn {
      background-color: var(--ink);
      color: #F5F5F2;
    }

    .inner-card--app .inner-action-btn:hover {
      background-color: var(--tea);
    }

    .inner-card--skill .inner-action-btn {
      background-color: #F4F6F3;
      color: var(--tea);
    }

    .inner-card--skill .inner-action-btn:hover {
      background-color: #FFFFFF;
    }

    /* ----- FRONT LAYER: MATTE PORCELAIN WHITE SLEEVE ----- */
    .sleeve-shell {
      position: relative;
      z-index: 2;
      filter:
        drop-shadow(0 1px 2px rgba(24, 24, 22, 0.032))
        drop-shadow(0 8px 20px rgba(24, 24, 22, 0.048));
      transition:
        transform 0.44s var(--spring),
        filter 0.44s var(--spring);
      will-change: transform;
    }

    .sleeve-card {
      position: relative;
      height: 214px;
      border-radius: 16px;
      background: linear-gradient(180deg, #FFFFFF 0%, #FDFDFC 100%);
      box-shadow:
        inset 0 0 0 1px rgba(24, 24, 22, 0.075),
        inset 0 1px 0 rgba(255, 255, 255, 0.98);
      /* True anti-aliased semicircular thumb notch (radius ~12.5px) at top center */
      -webkit-mask-image: radial-gradient(circle 12.8px at 50% 0, transparent 12.2px, #000 12.8px);
      mask-image: radial-gradient(circle 12.8px at 50% 0, transparent 12.2px, #000 12.8px);
      padding: 15px 17px 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }

    /* Crisp undistorted SVG top-edge hairline tracing the 12.5px notch curve */
    .notch-rim {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 29px;
      height: 15px;
      pointer-events: none;
      z-index: 5;
      display: block;
    }

    /* Subtle cursor-following specular light sheen */
    .sleeve-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      background: radial-gradient(
        210px circle at var(--mx, 50%) var(--my, 50%),
        rgba(46, 82, 66, 0.038) 0%,
        rgba(255, 255, 255, 0.55) 32%,
        transparent 72%
      );
      transition: opacity 0.3s ease;
    }

    .folio-wrapper:hover .sleeve-sheen {
      opacity: 1;
    }

    /* ----- 4 PURE-TYPOGRAPHY CARD LAYERS (ZERO ICONS, ZERO DOTS) ----- */
    .card-top-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 18px;
    }

    .card-category {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink-secondary);
      white-space: nowrap;
    }

    .card-pricing {
      font-size: 11px;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .card-title-block {
      position: relative;
      z-index: 2;
    }

    .card-name {
      margin: 0;
      font-size: 16.5px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .folio-wrapper:hover .card-name,
    .folio-wrapper:focus-visible .card-name {
      color: var(--tea);
    }

    .card-tagline {
      margin: 3px 0 0;
      font-size: 12px;
      line-height: 1.35;
      color: var(--ink-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-summary {
      position: relative;
      z-index: 2;
      margin: 13px 0 0;
      font-size: 12.5px;
      line-height: 1.6;
      color: #4A4C48;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1 1 auto;
    }

    .card-footer {
      position: relative;
      z-index: 2;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #EFEFE9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-platform {
      font-size: 11px;
      color: var(--ink-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .footer-swap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      height: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .footer-swap-default,
    .footer-swap-hover {
      font-size: 11px;
      white-space: nowrap;
      transition:
        transform 0.32s var(--spring),
        opacity 0.24s ease;
    }

    .footer-swap-default {
      color: var(--ink-muted);
    }

    .footer-swap-hover {
      position: absolute;
      right: 0;
      color: var(--tea);
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
    }

    .folio-wrapper:hover .footer-swap-default,
    .folio-wrapper:focus-visible .footer-swap-default {
      opacity: 0;
      transform: translateY(-10px);
    }

    .folio-wrapper:hover .footer-swap-hover,
    .folio-wrapper:focus-visible .footer-swap-hover {
      opacity: 1;
      transform: translateY(0);
    }

    /* =====================================================================
       KINETIC SLIDE-OUT PHYSICS (HOVER & GLOBAL EXPAND WAVE)
       ===================================================================== */
    .folio-wrapper:hover .inner-card,
    .folio-wrapper:focus-visible .inner-card,
    .folio-grid.is-expanded .folio-wrapper .inner-card {
      transform: translate3d(0, -39px, 0);
    }

    .folio-wrapper:hover .inner-card--oss,
    .folio-grid.is-expanded .folio-wrapper .inner-card--oss {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 8px 20px rgba(24, 24, 22, 0.22);
    }

    .folio-wrapper:hover .inner-card--app,
    .folio-grid.is-expanded .folio-wrapper .inner-card--app {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        inset 0 0 0 1px rgba(24, 24, 22, 0.085),
        0 8px 18px rgba(24, 24, 22, 0.085);
    }

    .folio-wrapper:hover .inner-card--skill,
    .folio-grid.is-expanded .folio-wrapper .inner-card--skill {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 8px 20px rgba(46, 82, 66, 0.24);
    }

    .folio-wrapper:hover .grip-capsule,
    .folio-wrapper:focus-visible .grip-capsule,
    .folio-grid.is-expanded .folio-wrapper .grip-capsule {
      opacity: 0;
      transform: translateX(-50%) translateY(-4px);
    }

    .folio-wrapper:hover .inner-action-bar,
    .folio-wrapper:focus-visible .inner-action-bar,
    .folio-grid.is-expanded .folio-wrapper .inner-action-bar {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      transition-delay: 0.04s;
    }

    .folio-wrapper:hover .sleeve-shell,
    .folio-wrapper:focus-visible .sleeve-shell {
      transform: translate3d(0, -2.5px, 0);
      filter:
        drop-shadow(0 2px 5px rgba(24, 24, 22, 0.045))
        drop-shadow(0 16px 32px rgba(24, 24, 22, 0.085));
    }

    .folio-wrapper:hover .sleeve-card,
    .folio-wrapper:focus-visible .sleeve-card {
      box-shadow:
        inset 0 0 0 1px rgba(46, 82, 66, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    /* Staggered wave timing when global toggle is switched */
    .folio-grid.is-waving .folio-wrapper .inner-card {
      transition-delay: var(--wave-delay, 0ms);
    }

    .folio-grid.is-waving .folio-wrapper .inner-action-bar {
      transition-delay: calc(var(--wave-delay, 0ms) + 45ms);
    }

    /* Subtle staggered entrance */
    @keyframes folioIn {
      from {
        opacity: 0;
        transform: translate3d(0, 8px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    .folio-enter {
      animation: folioIn 0.36s var(--spring) both;
    }

    /* =====================================================================
       EMPTY STATE & QUIET FOOTER
       ===================================================================== */
    .empty-state {
      display: none;
      padding: 92px 20px;
      text-align: center;
    }

    .empty-state.is-visible {
      display: block;
    }

    .empty-title {
      margin: 0;
      font-size: 15px;

      /* -------------------------------------------------------------------
         3. UTILITIES (HTML ESCAPING, SAFE CLIPBOARD, TOAST, PILL POSITION)
         ------------------------------------------------------------------- */
      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message) {
        if (!toastEl) return;
        toastEl.textContent = message;
        toastEl.classList.add('is-visible');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          if (toastEl) toastEl.classList.remove('is-visible');
        }, 2200);
      }

      /**
       * Sandboxed-iframe-safe clipboard copy using temporary textarea + execCommand('copy')
       */
      function copyTextSafe(text, toastMsg) {
        var success = false;
        var textarea = null;
        try {
          textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          textarea.style.left = '-9999px';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          textarea.setSelectionRange(0, textarea.value.length);
          success = document.execCommand('copy');
        } catch (err) {
          success = false;
        } finally {
          if (textarea && textarea.parentNode) {
            textarea.parentNode.removeChild(textarea);
          }
        }

        if (!success && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          try {
            navigator.clipboard.writeText(text).catch(function () {});
            success = true;
          } catch (err) {
            success = false;
          }
        }

        showToast(success ? toastMsg : '复制受限，请手动选择复制');
        return success;
      }

          var haystack = [
            item.name,

            item.replaces,
            item.pricing,
            item.cli || '',
            item.domain || '',
            item.preview || '',

            .join(' ')
            .toLowerCase();
          return haystack.indexOf(q) !== -1;
        });

        } else {
          var primaryLabel = item.category === 'oss' ? '前往开源主页 ↗' : '前往官方网站 ↗';
          var primaryClass =
            item.category === 'oss'
              ? 'drawer-btn-primary drawer-btn-primary--oss'
              : 'drawer-btn-primary';
          var secondaryLabel = item.category === 'oss' ? '复制安装命令' : '复制推荐文案';

          drawerFooter.innerHTML =
            '<a class="' +
            primaryClass +
            '" href="' +
            escapeHtml(item.url) +
            '" target="_blank" rel="noopener noreferrer">' +
            primaryLabel +
            '</a>' +
            '<button type="button" id="drawer-footer-copy" class="drawer-btn-secondary">' +
            secondaryLabel +
            '</button>';
        }

        // Bind drawer controls safely
        var closeBtn = document.getElementById('drawer-close-btn');
        if (closeBtn) {
          closeBtn.addEventListener('click', closeDrawer);
        }

        var inlineCopyBtn = document.getElementById('drawer-inline-copy');
        if (inlineCopyBtn) {
          var inlineOriginal = inlineCopyBtn.textContent;
          inlineCopyBtn.addEventListener('click', function () {
            var payload = getCopyPayload(item);
            if (copyTextSafe(payload.text, payload.msg)) {
              flashButtonCopied(inlineCopyBtn, inlineOriginal);
            }
          });
        }

        var footerCopyBtn = document.getElementById('drawer-footer-copy');
        if (footerCopyBtn) {
          var footerOriginal = footerCopyBtn.textContent;
          footerCopyBtn.addEventListener('click', function () {
            var payload = getCopyPayload(item);
            if (copyTextSafe(payload.text, payload.msg)) {
              flashButtonCopied(footerCopyBtn, footerOriginal);
            }
          });
        }

        drawerBody.scrollTop = 0;
        drawerBackdrop.classList.add('is-open');
        drawerPanel.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }

      function closeDrawer() {
        if (drawerBackdrop) drawerBackdrop.classList.remove('is-open');
        if (drawerPanel) drawerPanel.classList.remove('is-open');
        document.body.style.overflow = '';
        activeDrawerItem = null;
      }

      /* -------------------------------------------------------------------
         7. EVENT LISTENERS
         ------------------------------------------------------------------- */
      // Category segmented filter tabs
      segBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          activeFilter = btn.getAttribute('data-filter') || 'all';
          segBtns.forEach(function (other) {
            other.classList.toggle('is-active', other === btn);
          });
          positionSegPill(btn);
          renderGrid();
        });
      });

      window.addEventListener('resize', function () {
        var activeBtn = document.querySelector('.seg-btn.is-active');
        positionSegPill(activeBtn);
      });

      // Real-time search input
      if (searchInput) {
        searchInput.addEventListener('input', function (e) {
          searchQuery = e.target.value || '';
          if (searchClearBtn) {
            searchClearBtn.classList.toggle('is-visible', searchQuery.length > 0);
          }
          renderGrid();
        });
      }

      if (searchClearBtn) {
        searchClearBtn.addEventListener('click', function () {
          searchQuery = '';
          if (searchInput) {
            searchInput.value = '';
            searchInput.focus();
          }
          searchClearBtn.classList.remove('is-visible');
          renderGrid();
        });
      }

      // Empty state reset button
      if (emptyResetBtn) {
        emptyResetBtn.addEventListener('click', function () {
          activeFilter = 'all';
          searchQuery = '';
          if (searchInput) searchInput.value = '';
          if (searchClearBtn) searchClearBtn.classList.remove('is-visible');
          segBtns.forEach(function (btn) {
            var isAll = btn.getAttribute('data-filter') === 'all';
            btn.classList.toggle('is-active', isAll);
            if (isAll) positionSegPill(btn);
          });
          renderGrid();
        });
      }

      // Global staggered wave toggle ("展开内芯")
      if (expandToggleBtn && gridEl) {
        expandToggleBtn.addEventListener('click', function () {
          isAllExpanded = !isAllExpanded;
          gridEl.classList.add('is-waving');
          if (waveTimer) clearTimeout(waveTimer);
          waveTimer = setTimeout(function () {
            if (gridEl) gridEl.classList.remove('is-waving');
          }, 820);

          gridEl.classList.toggle('is-expanded', isAllExpanded);
          expandToggleBtn.classList.toggle('is-active', isAllExpanded);
          expandToggleBtn.setAttribute('aria-checked', String(isAllExpanded));
          if (expandLabelEl) {
            expandLabelEl.textContent = isAllExpanded ? '收回内芯' : '展开内芯';
          }
        });
      }

      // Cursor-following light sheen on outer sleeve
      if (gridEl) {
        gridEl.addEventListener('mousemove', function (e) {
          var wrapper = e.target.closest('.folio-wrapper');
          if (!wrapper) return;
          var card = wrapper.querySelector('.sleeve-card');
          if (!card) return;
          var rect = card.getBoundingClientRect();
          card.style.setProperty('--mx', e.clientX - rect.left + 'px');
          card.style.setProperty('--my', e.clientY - rect.top + 'px');
        });

        // Delegated click handler: inner copy/link stops propagation; sleeve opens drawer
        gridEl.addEventListener('click', function (e) {
          var copyBtn = e.target.closest('[data-copy-id]');
          if (copyBtn) {
            e.stopPropagation();
            var copyId = copyBtn.getAttribute('data-copy-id');
            var copyItem = SPECIMENS.find(function (x) {
              return x.id === copyId;
            });
            if (copyItem) {
              var payload = getCopyPayload(copyItem);
              if (copyTextSafe(payload.text, payload.msg)) {
                flashButtonCopied(copyBtn, '复制');
              }
            }
            return;
          }

          var directLink = e.target.closest('[data-direct-link]');
          if (directLink) {
            e.stopPropagation();
            return;
          }

          var wrapper = e.target.closest('.folio-wrapper');
          if (wrapper) {
            var itemId = wrapper.getAttribute('data-item-id');
            var found = SPECIMENS.find(function (x) {
              return x.id === itemId;
            });
            if (found) openDrawer(found);
          }
        });

        // Keyboard accessibility (Enter / Space opens drawer)
        gridEl.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          if (e.target.closest('button, a')) return;
          var wrapper = e.target.closest('.folio-wrapper');
          if (!wrapper) return;
          e.preventDefault();
          var itemId = wrapper.getAttribute('data-item-id');
          var found = SPECIMENS.find(function (x) {
            return x.id === itemId;
          });
          if (found) openDrawer(found);
        });
      }

      // Close drawer on frosted backdrop click or ESC key
      if (drawerBackdrop) {
        drawerBackdrop.addEventListener('click', closeDrawer);
      }

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && activeDrawerItem) {
          closeDrawer();
        }
      });

      /* -------------------------------------------------------------------
         8. INITIALIZATION
         ------------------------------------------------------------------- */
      function init() {
        renderGrid();
        requestAnimationFrame(function () {
          var activeBtn = document.querySelector('.seg-btn.is-active');
          positionSegPill(activeBtn);
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
