<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>器物志 · Curated Tools</title>

  <!-- Typography: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#F6F6F3',
            tea: '#2B5242',
            'tea-mist': '#EBF1EE',
            ink: '#181A19',
            secondary: '#6E7370',
            muted: '#9BA19E',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', '"PingFang SC"', '"Hiragino Sans GB"', 'sans-serif'],
            mono: ['"JetBrains Mono"', '"SF Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --canvas: #F6F6F3;
      --tea: #2B5242;
      --tea-mist: #EBF1EE;
      --ink: #181A19;
      --secondary: #6E7370;
      --muted: #9BA19E;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background-color: var(--canvas);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background-color: var(--canvas);
      color: var(--ink);
      font-family: Inter, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Barely-there museum archival paper grain */
    .paper-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* =====================================================================
       STRICT 5-COLUMN GALLERY GRID & RESPONSIVE BREAKPOINTS
       ===================================================================== */
    .folio-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      column-gap: 20px;
      row-gap: 24px;
    }

    @media (max-width: 1199px) {
      .folio-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 959px) {
      .folio-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 639px) {
      .folio-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 14px;
        row-gap: 18px;
      }
    }

    @media (max-width: 419px) {
      .folio-grid {
        grid-template-columns: 1fr;
      }
    }

    /* =====================================================================
       SEGMENTED FILTER BAR WITH SILKY SLIDING WHITE PILL
       ===================================================================== */
    .seg-track {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 3px;
      background-color: rgba(24, 26, 25, 0.045);
      border-radius: 10px;
      box-shadow: inset 0 0 0 1px rgba(24, 26, 25, 0.04);
    }

    .seg-pill {
      position: absolute;
      top: 3px;
      left: 0;
      height: calc(100% - 6px);
      background-color: #FFFFFF;
      border-radius: 7px;
      box-shadow:
        0 1px 2px rgba(24, 26, 25, 0.06),
        0 2px 6px rgba(24, 26, 25, 0.04),
        0 0 0 0.5px rgba(24, 26, 25, 0.05);
      transform: translate3d(0, 0, 0);
      transition:
        transform 0.36s var(--spring),
        width 0.36s var(--spring);
      will-change: transform, width;
      pointer-events: none;
      z-index: 0;
    }

    .seg-btn {
      position: relative;
      z-index: 1;
      transition: color 0.2s ease;
    }

    /* Tactile minimalist pill toggle indicator */
    .toggle-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background-color: #C2C7C4;
      transition:
        background-color 0.28s ease,
        box-shadow 0.28s ease;
    }

    .toggle-active .toggle-dot {
      background-color: var(--tea);
      box-shadow: 0 0 0 3px rgba(43, 82, 66, 0.14);
    }

    /* =====================================================================
       PRECISION SLIDE-OUT FOLIO ARCHITECTURE (5-PER-ROW OPTIMIZED)
       ===================================================================== */
    .folio-wrapper {
      position: relative;
      padding-top: 44px;
      cursor: pointer;
      outline: none;
    }

    .folio-stack {
      position: relative;
    }

    /* ----- BACK LAYER: INNER CARD ----- */
    .inner-card {
      position: absolute;
      top: -8px;
      left: 8px;
      right: 8px;
      height: 86px;
      border-radius: 12px 12px 6px 6px;
      z-index: 1;
      overflow: hidden;
      transform: translate3d(0, 0, 0);
      transition:
        transform 0.48s var(--spring),
        box-shadow 0.44s var(--spring);
      will-change: transform;
    }

    /* Category 1: OSS — Matte Obsidian */
    .inner-card--oss {
      background-color: #1B1D1C;
      color: #F0F2F1;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        0 2px 8px rgba(24, 26, 25, 0.14);
    }

    /* Category 2: APP — Anodized Mist Titanium */
    .inner-card--app {
      background-color: #E4E9E6;
      color: #1A1D1B;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.85),
        inset 0 0 0 1px rgba(24, 26, 25, 0.06),
        0 2px 8px rgba(24, 26, 25, 0.05);
    }

    /* Category 3: SKILL — Deep Tea-Green Celadon */
    .inner-card--skill {
      background-color: #2B5242;
      color: #F4F7F5;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 2px 10px rgba(43, 82, 66, 0.18);
    }

    /* Minimalist tactile grip hairline centered inside the 13px notch at rest */
    .grip-hairline {
      position: absolute;
      top: 13px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 1.5px;
      border-radius: 9999px;
      pointer-events: none;
      transition:
        opacity 0.2s ease,
        transform 0.35s var(--spring);
    }

    .inner-card--oss .grip-hairline {
      background-color: rgba(240, 242, 241, 0.28);
    }

    .inner-card--app .grip-hairline {
      background-color: rgba(26, 29, 27, 0.22);
    }

    .inner-card--skill .grip-hairline {
      background-color: rgba(244, 247, 245, 0.34);
    }

    /* Compact 38px revealed top action bar (fits comfortably in ~220px width) */
    .inner-action-bar {
      height: 38px;
      padding: 0 9px 0 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition:
        opacity 0.24s ease,
        transform 0.42s var(--spring);
    }

    /* ----- FRONT LAYER: OUTER PORCELAIN SLEEVE ----- */
    .sleeve-shell {
      position: relative;
      z-index: 2;
      /* Whisper-soft layered ambient shadow honoring the semicircular notch cutout */
      filter:
        drop-shadow(0 1px 2px rgba(24, 26, 25, 0.035))
        drop-shadow(0 8px 20px rgba(24, 26, 25, 0.045));
      transition:
        transform 0.44s var(--spring),
        filter 0.44s var(--spring);
      will-change: transform;
    }

    .sleeve-card {
      position: relative;
      height: 236px;
      border-radius: 16px;
      background-color: #FFFFFF;
      box-shadow:
        inset 0 0 0 1px rgba(20, 22, 20, 0.07),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      /* Anti-aliased 13px semicircular thumb notch centered at top edge */
      -webkit-mask-image: radial-gradient(circle 13.5px at 50% 0, transparent 12.9px, #000 13.5px);
      mask-image: radial-gradient(circle 13.5px at 50% 0, transparent 12.9px, #000 13.5px);
      padding: 20px 18px 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.32s ease;
    }

    /* Precision 1px SVG hairline matching the 13px semicircular notch */
    .notch-rim {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 15px;
      pointer-events: none;
      z-index: 4;
    }

    /* Barely-there mouse-following specular sheen */
    .sleeve-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      background: radial-gradient(
        220px circle at var(--mx, 50%) var(--my, 50%),
        rgba(43, 82, 66, 0.035) 0%,
        rgba(255, 255, 255, 0.55) 28%,
        transparent 68%
      );
      transition: opacity 0.3s ease;
    }

    .folio-wrapper:hover .sleeve-sheen {
      opacity: 1;
    }

    /* 38px x 38px Porcelain Squircle Icon Container */
    .icon-squircle {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F7F8F6 100%);
      border: 1px solid rgba(20, 22, 20, 0.075);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 1px 3px rgba(24, 26, 25, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #242725;
      transition:
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .folio-wrapper:hover .icon-squircle {
      color: var(--tea);
      border-color: rgba(43, 82, 66, 0.2);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 1),
        0 2px 6px rgba(43, 82, 66, 0.07);
    }

    /* =====================================================================
       KINETIC HOVER & GLOBAL EXPAND PHYSICS
       ===================================================================== */
    .folio-wrapper:hover .inner-card,
    .folio-wrapper:focus-visible .inner-card,
    .grid-expanded .folio-wrapper .inner-card {
      transform: translate3d(0, -38px, 0);
    }

    .folio-wrapper:hover .inner-card--oss,
    .grid-expanded .folio-wrapper .inner-card--oss {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.11),
        0 8px 20px rgba(24, 26, 25, 0.22);
    }

    .folio-wrapper:hover .inner-card--app,
    .grid-expanded .folio-wrapper .inner-card--app {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        inset 0 0 0 1px rgba(24, 26, 25, 0.08),
        0 8px 18px rgba(24, 26, 25, 0.08);
    }

    .folio-wrapper:hover .inner-card--skill,
    .grid-expanded .folio-wrapper .inner-card--skill {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 8px 20px rgba(43, 82, 66, 0.24);
    }

    .folio-wrapper:hover .grip-hairline,
    .folio-wrapper:focus-visible .grip-hairline,
    .grid-expanded .folio-wrapper .grip-hairline {
      opacity: 0;
      transform: translateX(-50%) translateY(-4px);
    }

    .folio-wrapper:hover .inner-action-bar,
    .folio-wrapper:focus-visible .inner-action-bar,
    .grid-expanded .folio-wrapper .inner-action-bar {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      transition-delay: 0.04s;
    }

    .folio-wrapper:hover .sleeve-shell,
    .folio-wrapper:focus-visible .sleeve-shell {
      transform: translate3d(0, -2px, 0);
      filter:
        drop-shadow(0 2px 4px rgba(24, 26, 25, 0.045))
        drop-shadow(0 16px 32px rgba(24, 26, 25, 0.08));
    }

    .folio-wrapper:hover .sleeve-card,
    .folio-wrapper:focus-visible .sleeve-card {
      box-shadow:
        inset 0 0 0 1px rgba(43, 82, 66, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    /* Staggered wave delay during global expand/collapse */
    .is-waving .folio-wrapper .inner-card {
      transition-delay: var(--wave-delay, 0ms);
    }

    .is-waving .folio-wrapper .inner-action-bar {
      transition-delay: calc(var(--wave-delay, 0ms) + 55ms);
    }

    /* Filter entrance fade */
    @keyframes folioIn {
      from {
        opacity: 0;
        transform: translate3d(0, 8px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    .folio-enter {
      animation: folioIn 0.38s var(--spring) both;
    }

    /* 2-line clamp utility */
    .clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Minimal keycap for drawer shortcut display */
    .drawer-kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 25px;
      padding: 0 7px;
      border-radius: 6px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink);
      background-color: #FFFFFF;
      border: 1px solid rgba(24, 26, 25, 0.11);
      box-shadow: 0 1px 0 rgba(24, 26, 25, 0.08);
    }

    /* =====================================================================
       APPLE-STYLE RIGHT DETAIL DRAWER & FLOATING TOAST
       ===================================================================== */
    .drawer-backdrop {
      background-color: rgba(24, 26, 25, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      transform: translate3d(100%, 0, 0);
      transition: transform 0.42s var(--spring);
      will-change: transform;
    }

    .drawer-panel.open {
      transform: translate3d(0, 0, 0);
    }

    .toast-pill {
      transform: translate3d(-50%, 16px, 0);
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.32s var(--spring),
        opacity 0.22s ease;
    }

    .toast-pill.show {
      transform: translate3d(-50%, 0, 0);
      opacity: 1;
    }

    .clean-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .clean-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .clean-scroll::-webkit-scrollbar-thumb {
      background: rgba(24, 26, 25, 0.12);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="selection:bg-tea-mist selection:text-tea">

  <!-- Barely-there fine paper grain -->
  <div class="paper-grain" aria-hidden="true"></div>

  <!-- Minimal Floating Bottom Toast -->
  <div
    id="toast"
    role="status"
    aria-live="polite"
    class="toast-pill fixed bottom-7 left-1/2 z-[70] inline-flex items-center gap-2 px-4 py-2 rounded-full bg-ink text-[#F4F6F5] text-[12px] font-medium shadow-xl shadow-ink/20 border border-white/10"
  >
    <span class="w-1.5 h-1.5 rounded-full bg-[#4ADE80]"></span>
    <span id="toast-msg">已复制</span>
  </div>

  <!-- Main Gallery Container (max-width: 1440px, 40px horizontal padding on desktop) -->
  <div class="relative z-10 max-w-[1440px] mx-auto px-5 sm:px-7 lg:px-[40px] pt-12 sm:pt-16 pb-24">

    <!-- ===================================================================
         SWISS / APPLE GALLERY HEADER
         =================================================================== -->
    <header class="pb-7 mb-4 border-b border-ink/[0.06] flex flex-col lg:flex-row lg:items-end justify-between gap-5">
      <!-- Left: Title & Subtitle -->
      <div>
        <div class="flex items-baseline gap-3">
          <h1 class="text-[28px] sm:text-[32px] font-semibold tracking-[-0.03em] text-ink leading-none">
            器物志
          </h1>
          <span class="font-mono text-[11px] uppercase tracking-[0.16em] text-muted">
            CURATED TOOLS
          </span>
        </div>
        <p class="mt-2 text-[13.5px] text-secondary leading-relaxed">
          私藏开源项目、效率软件与 AI Skill 标本
        </p>
      </div>

      <!-- Right: Segmented Filter Bar + Pill Toggle -->
      <div class="flex flex-wrap items-center gap-3">
        <nav id="seg-track" class="seg-track" aria-label="分类筛选">
          <div id="seg-pill" class="seg-pill"></div>
          <button
            type="button"
            data-filter="all"
            class="seg-btn px-3.5 py-1.5 text-[12.5px] font-medium text-ink rounded-[7px] whitespace-nowrap"
          >
            全部
          </button>
          <button
            type="button"
            data-filter="oss"
            class="seg-btn px-3.5 py-1.5 text-[12.5px] font-medium text-secondary hover:text-ink rounded-[7px] whitespace-nowrap"
          >
            开源
          </button>
          <button
            type="button"
            data-filter="app"
            class="seg-btn px-3.5 py-1.5 text-[12.5px] font-medium text-secondary hover:text-ink rounded-[7px] whitespace-nowrap"
          >
            软件
          </button>
          <button
            type="button"
            data-filter="skill"
            class="seg-btn px-3.5 py-1.5 text-[12.5px] font-medium text-secondary hover:text-ink rounded-[7px] whitespace-nowrap"
          >
            Skill
          </button>
        </nav>

        <!-- Tactile Minimalist Pill Toggle -->
        <button
          id="expand-all-btn"
          type="button"
          aria-pressed="false"
          class="inline-flex items-center gap-2 px-3.5 py-[7px] rounded-full bg-white hover:bg-[#FCFDFC] border border-ink/[0.08] hover:border-tea/30 shadow-[0_1px_2px_rgba(24,26,25,0.03)] text-[12.5px] font-medium text-ink transition-all duration-200"
        >
          <span class="toggle-dot" aria-hidden="true"></span>
          <span id="expand-all-text">展开全部内芯</span>
        </button>
      </div>
    </header>

    <!-- ===================================================================
         5-COLUMN SLIDE-OUT FOLIO GRID (2 BALANCED ROWS OF 5)
         =================================================================== -->
    <main>
      <div id="folio-grid" class="folio-grid">
        <!-- 10 cards rendered dynamically -->
      </div>
    </main>

    <!-- Quiet Gallery Footer -->
    <footer class="mt-20 pt-5 border-t border-ink/[0.05] flex flex-col sm:flex-row items-center justify-between gap-2 text-[12px] text-muted">
      <span>悬停滑出快捷内芯 · 点击封套阅读站长手记</span>
      <span class="font-mono text-[11px] tracking-[0.12em]">10 SPECIMENS · ARCHIVE</span>
    </footer>
  </div>

  <!-- ===================================================================
       APPLE-STYLE RIGHT DETAIL DRAWER (440px)
       =================================================================== -->
  <div id="drawer-backdrop" class="drawer-backdrop fixed inset-0 z-50" aria-hidden="true"></div>

  <aside
    id="drawer-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="drawer-title"
    class="drawer-panel fixed top-0 right-0 z-50 h-full w-full max-w-[440px] bg-white border-l border-ink/[0.07] shadow-2xl shadow-ink/15 flex flex-col"
  >
    <!-- Top 3px Category Accent Bar -->
    <div id="drawer-accent-bar" class="h-[3px] w-full shrink-0"></div>

    <!-- Drawer Top Header -->
    <div id="drawer-header" class="px-7 pt-6 pb-5 border-b border-ink/[0.06] shrink-0">
      <!-- Populated dynamically -->
    </div>

    <!-- Scrollable Editorial Content -->
    <div id="drawer-body" class="clean-scroll flex-1 overflow-y-auto px-7 py-6 space-y-6">
      <!-- Populated dynamically -->
    </div>

    <!-- Full-Width Primary CTA Footer -->
    <div id="drawer-footer" class="px-7 py-5 border-t border-ink/[0.06] bg-canvas/60 shrink-0">
      <!-- Populated dynamically -->
    </div>
  </aside>

  <!-- ===================================================================
       CURATED DATA & INTERACTION ENGINE
       =================================================================== -->
  <script>
    /**
     * Bespoke Minimal Monochrome SVG Icons (1.55px stroke, 18px x 18px)
     */
    const ICONS = {
      raycast: `<svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17.5 17.5 5"/><path d="M12.5 5H19v6.5"/><path d="M4.5 11.5 8 15"/><path d="M9 16l3.5 3.5"/><circle cx="7.5" cy="7.5" r="1.8"/></svg>`,
      excalidraw: `<svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5 19.5 8.5 8.5 19.5 4 20l.5-4.5L15.5 4.5Z"/><path d="M13 7l4 4"/><path d="M4 20h16"/></svg>`,
      'ui-craft': `<svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M17 13.5v7M13.5 17h7"/></svg>`,

    /* =====================================================================
       HELPERS: HTML ESCAPE, IFRAME-SAFE CLIPBOARD, TOAST
       ===================================================================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message) {
      toastMsg.textContent = message;
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2100);
    }

    function copyText(text, toastMessage) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(ok ? toastMessage : '复制受限，请手动选择');
        return ok;
      } catch (err) {
        showToast('复制失败，请手动复制');
        return false;
      }
    }

    /**
     * Morph quick copy button into crisp checkmark state ("已复制")
     */
    function setCopiedState(btn, resetHtml) {
      if (!btn) return;
      btn.innerHTML = `${CHECK_ICON}<span>已复制</span>`;
      if (btn._t) clearTimeout(btn._t);
      btn._t = setTimeout(() => {
        btn.innerHTML = resetHtml;
      }, 1500);
    }

    /* =====================================================================
       SEGMENTED FILTER PILL GEOMETRY
       ===================================================================== */
    function positionSegPill(btn) {
      if (!btn) return;
      segPill.style.width = `${btn.offsetWidth}px`;
      segPill.style.transform = `translate3d(${btn.offsetLeft}px, 0, 0)`;
    }

                  ${escapeHtml(item.summary)}
                </p>

                <!-- 4. Ultra-fine Footer -->
                <div class="relative z-10 mt-4 pt-3 border-t border-black/[0.05] flex items-center justify-between">
                  <span class="font-mono text-[11px] text-muted truncate">
                    ${escapeHtml(item.meta)}
                  </span>
                  <span
                    class="text-[12px] text-muted group-hover:text-tea transition-all duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5"
                    aria-hidden="true"
                  >
                    ↗
                  </span>
                </div>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderGrid() {
      const list =
        activeFilter === 'all'
          ? SPECIMENS
          : SPECIMENS.filter((item) => item.category === activeFilter);
      gridEl.innerHTML = list.map((item, idx) => buildCardHTML(item, idx)).join('');
    }

    /* =====================================================================
       RIGHT-SIDE DETAIL DRAWER (440px APPLE EDITORIAL STYLE)
       ===================================================================== */
    function renderDrawerInteractiveBlock(item) {
      if (item.category === 'oss') {
        return `
          <section class="space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="font-mono text-[11px] uppercase tracking-[0.12em] text-muted">安装 / 启动命令</span>
              <button
                type="button"
                id="drawer-copy-btn"
                class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-[11.5px] font-medium bg-tea-mist text-tea hover:bg-tea hover:text-white transition-colors"
              >
                ${COPY_ICON}<span>复制命令</span>
              </button>
            </div>
            <div class="rounded-xl bg-[#1B1D1C] px-4 py-3.5 font-mono text-[12px] text-[#F0F2F1] overflow-x-auto">
              <span class="text-[#34D399] select-none mr-2">$</span>${escapeHtml(item.cli)}
            </div>
          </section>
        `;
      }

      if (item.category === 'skill') {
        return `
          <section class="space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="font-mono text-[11px] uppercase tracking-[0.12em] text-muted">Skill 指令</span>
                <span class="font-mono text-[11px] px-1.5 py-0.5 rounded bg-tea-mist text-tea">${escapeHtml(item.trigger)}</span>
              </div>
              <button
                type="button"
                id="drawer-copy-btn"
                class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-[11.5px] font-medium bg-tea-mist text-tea hover:bg-tea hover:text-white transition-colors"
              >
                ${COPY_ICON}<span>复制 Prompt</span>
              </button>
            </div>
            <pre class="p-4 rounded-xl bg-canvas border border-ink/[0.07] font-mono text-[11.5px] leading-relaxed text-ink/90 whitespace-pre-wrap break-words">${escapeHtml(item.prompt)}</pre>
          </section>
        `;
      }

      // APP shortcut showcase
      const keysHtml = (item.shortcut || [])
        .map((k) => `<kbd class="drawer-kbd">${escapeHtml(k)}</kbd>`)
        .join('<span class="text-[11px] text-muted mx-1">+</span>');

      return `
        <section class="p-4 rounded-xl bg-canvas border border-ink/[0.06] flex items-center justify-between gap-3">
          <div>
            <div class="font-mono text-[10.5px] uppercase tracking-[0.12em] text-muted">快捷方式 / 入口</div>
            <div class="mt-0.5 text-[12.5px] text-secondary">支持平台：${escapeHtml(item.meta)}</div>
          </div>
          <div class="inline-flex items-center shrink-0">${keysHtml}</div>
        </section>
      `;
    }

    function openDrawer(item) {
      activeDrawerItem = item;

      const accentColors = {
        oss: '#1B1D1C',
        app: '#B9C4BE',
        skill: '#2B5242',
      };

      const pillClasses = {
        oss: 'bg-[#1B1D1C] text-[#F0F2F1]',
        app: 'bg-[#E4E9E6] text-[#1A1D1B]',
        skill: 'bg-[#2B5242] text-[#F4F7F5]',
      };

      drawerAccentBar.style.backgroundColor = accentColors[item.category];

      drawerHeader.innerHTML = `
        <div class="flex items-center justify-between mb-5">
          <div class="flex items-center gap-2">
            <span class="font-mono text-[11px] text-muted">${item.index}</span>
            <span class="px-2 py-0.5 rounded-full font-mono text-[10.5px] font-medium ${pillClasses[item.category]}">
              ${item.categoryName}
            </span>
          </div>
          <button
            id="drawer-close-btn"
            type="button"
            aria-label="关闭详情"
            class="inline-flex items-center gap-1.5 px-2 py-1 rounded-lg text-muted hover:text-ink hover:bg-canvas transition-colors"
          >
            <span class="font-mono text-[10px]">ESC</span>
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <div class="flex items-center gap-3.5">
          <div class="icon-squircle">
            ${ICONS[item.id]}
          </div>
          <div class="min-w-0">
            <h2 id="drawer-title" class="text-[20px] font-semibold tracking-[-0.025em] text-ink truncate">
              ${escapeHtml(item.name)}
            </h2>
            <p class="mt-0.5 text-[13px] text-secondary leading-snug">
              ${escapeHtml(item.summary)}
            </p>
          </div>
        </div>
      `;

      const highlightsHtml = item.highlights
        .map(
          (text, i) => `
            <li class="flex items-start gap-2.5 text-[13px] leading-[1.68] text-ink/85">
              <span class="font-mono text-[10.5px] text-tea mt-[3px] shrink-0">0${i + 1}</span>
              <span>${escapeHtml(text)}</span>
            </li>
          `
        )
        .join('');

      drawerBody.innerHTML = `
        <section class="space-y-2">
          <h3 class="font-mono text-[11px] uppercase tracking-[0.12em] text-muted">站长手记</h3>
          <p class="pl-3.5 py-2.5 pr-3 rounded-r-lg bg-canvas border-l-2 border-tea text-[13.5px] leading-[1.72] text-ink/90">
            ${escapeHtml(item.note)}
          </p>
        </section>

        <section class="space-y-2.5">
          <h3 class="font-mono text-[11px] uppercase tracking-[0.12em] text-muted">核心亮点</h3>
          <ul class="space-y-2">
            ${highlightsHtml}
          </ul>
        </section>

        ${renderDrawerInteractiveBlock(item)}
      `;

      drawerFooter.innerHTML = `
        <a
          href="${escapeHtml(item.url)}"
          target="_blank"
          rel="noopener noreferrer"
          class="w-full py-2.5 px-4 rounded-xl bg-tea hover:bg-[#224235] text-[#F4F7F5] text-[13px] font-medium flex items-center justify-center gap-1.5 shadow-sm shadow-tea/15 transition-colors"
        >
          <span>访问官方主页</span>
          <span aria-hidden="true">↗</span>
        </a>
      `;

      document.getElementById('drawer-close-btn').addEventListener('click', closeDrawer);

      const drawerCopyBtn = document.getElementById('drawer-copy-btn');
      if (drawerCopyBtn) {
        const originalHtml = drawerCopyBtn.innerHTML;
        drawerCopyBtn.addEventListener('click', () => {
          const payload = item.category === 'oss' ? item.cli : item.prompt;
          const msg =
            item.category === 'oss'
              ? `已复制 ${item.name} 安装命令`
              : `已复制「${item.name}」Prompt`;
          if (copyText(payload, msg)) {
            setCopiedState(drawerCopyBtn, originalHtml);
          }
        });
      }

      drawerBackdrop.classList.add('open');
      drawerPanel.classList.add('open');
      document.body.style.overflow = 'hidden';
      drawerBody.scrollTop = 0;
    }

    function closeDrawer() {
      drawerBackdrop.classList.remove('open');
      drawerPanel.classList.remove('open');
      document.body.style.overflow = '';
      activeDrawerItem = null;
    }

    /* =====================================================================
       EVENT WIRING
       ===================================================================== */
    // Segmented filter tabs
    segBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.filter;
        segBtns.forEach((b) => {
          const active = b === btn;
          b.classList.toggle('text-ink', active);
          b.classList.toggle('text-secondary', !active);
        });
        positionSegPill(btn);
        renderGrid();
      });
    });

    window.addEventListener('resize', () => {
      const activeBtn = document.querySelector(`.seg-btn[data-filter="${activeFilter}"]`);
      positionSegPill(activeBtn);
    });

    // Global "展开全部内芯" / "收回内芯" staggered wave toggle
    expandAllBtn.addEventListener('click', () => {
      isAllExpanded = !isAllExpanded;

      gridEl.classList.add('is-waving');
      if (waveTimer) clearTimeout(waveTimer);
      waveTimer = setTimeout(() => {
        gridEl.classList.remove('is-waving');
      }, 750);

      gridEl.classList.toggle('grid-expanded', isAllExpanded);
      expandAllBtn.classList.toggle('toggle-active', isAllExpanded);
      expandAllBtn.classList.toggle('border-tea/35', isAllExpanded);
      expandAllBtn.setAttribute('aria-pressed', String(isAllExpanded));
      expandAllText.textContent = isAllExpanded ? '收回内芯' : '展开全部内芯';
    });

    // Subtle mouse-following specular sheen on outer porcelain sleeve
    gridEl.addEventListener('mousemove', (e) => {
      const wrapper = e.target.closest('.folio-wrapper');
      if (!wrapper) return;
      const card = wrapper.querySelector('.sleeve-card');
      if (!card) return;
      const rect = card.getBoundingClientRect();
      card.style.setProperty('--mx', `${e.clientX - rect.left}px`);
      card.style.setProperty('--my', `${e.clientY - rect.top}px`);
    });

    // Click delegation: Inner quick actions vs. Opening detail drawer
    gridEl.addEventListener('click', (e) => {
      const copyBtn = e.target.closest('[data-copy-id]');
      if (copyBtn) {
        e.stopPropagation();
        const item = SPECIMENS.find((x) => x.id === copyBtn.dataset.copyId);
        if (item) {
          const payload = item.category === 'oss' ? item.cli : item.prompt;
          const msg =
            item.category === 'oss'
              ? `已复制 ${item.name} 命令`
              : `已复制「${item.name}」指令`;
          const resetHtml =
            copyBtn.dataset.mode === 'oss' ? COPY_ICON : '<span>复制</span>';
          if (copyText(payload, msg)) {
            setCopiedState(copyBtn, resetHtml);
          }
        }
        return;
      }

      const directLink = e.target.closest('[data-direct-link]');
      if (directLink) {
        e.stopPropagation();
        return;
      }

      const wrapper = e.target.closest('.folio-wrapper');
      if (wrapper) {
        const item = SPECIMENS.find((x) => x.id === wrapper.dataset.itemId);
        if (item) openDrawer(item);
      }
    });

    // Keyboard accessibility for cards
    gridEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        const wrapper = e.target.closest('.folio-wrapper');
        if (wrapper && !e.target.closest('button, a')) {
          e.preventDefault();
          const item = SPECIMENS.find((x) => x.id === wrapper.dataset.itemId);
          if (item) openDrawer(item);
        }
      }
    });

    // Close drawer via backdrop or ESC
    drawerBackdrop.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && activeDrawerItem) {
        closeDrawer();
      }
    });

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      renderGrid();
      requestAnimationFrame(() => {
        positionSegPill(segBtns[0]);
      });
    });
  </script>
</body>
</html>
